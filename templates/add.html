<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add application - JobTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Add an application</h1>

        <form method="post">
            <div class="field">
                <label for="company">Company</label>
                <input name="company" id="company" required>
            </div>
            <div class="field">
                <label for="role">Role</label>
                <input name="role" id="role" required>
            </div>
            <div class="field">
                <label for="link">Link to advert</label>
                <input type="url" name="link" id="link">
            </div>
            <div class="field">
                <label for="status">Status</label>
                <select name="status" id="status">
                    <option>Applied</option>
                    <option>Interview</option>
                    <option>Offer</option>
                    <option>Rejected</option>
                </select>
            </div>
            <div class="field">
                <label for="date_applied">Date applied</label>
                <input type="date" name="date_applied" id="date_applied" required>
            </div>
            <div class="field">
                <label for="follow_up_date">Follow up date</label>
                <input type="date" name="follow_up_date" id="follow_up_date">
            </div>
            <div class="field">
                <label for="notes">Notes</label>
                <textarea name="notes" id="notes" rows="4"></textarea>
            </div>

            <button class="button" type="submit">Save</button>
            <a href="{{ url_for('index') }}">Cancel</a>
        </form>
    </div>
</body>
</html>
